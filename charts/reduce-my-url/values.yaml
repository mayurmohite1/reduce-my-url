# Default values for reduce-my-url.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
api:
  replicaCount: 1

  image:
    repository: reduce-my-url-api
    tag: dev
    pullPolicy: IfNotPresent

  port: 4000
  hostPort: 4000

  env:
    databaseUrl: postgres://app:app@postgres:5432/shortener
    redisUrl: redis://redis:6379

  configMap:
    name: reduce-my-url-config

  secret:
    name: reduce-my-url-secrets

  readinessProbe:
    path: /health
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6

  livenessProbe:
    path: /health
    initialDelaySeconds: 20
    timeoutSeconds: 5
    periodSeconds: 15
    failureThreshold: 3

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi

config:
  nodeEnv: production
  publicBaseUrl: http://localhost:8080
  viteApiBaseUrl: http://localhost/api
  geoMode: geoip-lite

  redis:
    host: redis
    port: 6379

  postgres:
    host: postgres
    port: 5432

postgres:
  replicaCount: 1

  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  port: 5432

  pgdata: /var/lib/postgresql/data/pgdata

  persistence:
    size: 2Gi
    accessMode: ReadWriteOnce

  readinessProbe:
    user: app
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6

  secretName: reduce-my-url-secrets

redis:
  replicaCount: 1

  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent

  port: 6379

  persistence:
    claimName: redis-data
    accessMode: ReadWriteOnce
    size: 1Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi

  readinessProbe:
    initialDelaySeconds: 10
    timeoutSeconds: 5
    periodSeconds: 10
    failureThreshold: 6

web:
  replicaCount: 1

  image:
    repository: reduce-my-url-web
    tag: dev
    pullPolicy: IfNotPresent

  port: 80

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 300m
      memory: 256Mi

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

secret:
  postgresUser: app
  postgresPassword: app
  postgresDb: shortener
  jwtSecret: change-this-in-production

httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
    - chart-example.local
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
