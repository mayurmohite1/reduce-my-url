apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: reduce-my-url
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: reduce-my-url-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              hostPort: 4000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: reduce-my-url-config
                  key: NODE_ENV
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              value: postgres://app:app@postgres:5432/shortener
            - name: REDIS_URL
              value: redis://redis:6379
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: reduce-my-url-secrets
                  key: JWT_SECRET
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: reduce-my-url-config
                  key: PUBLIC_BASE_URL
            - name: GEO_MODE
              valueFrom:
                configMapKeyRef:
                  name: reduce-my-url-config
                  key: GEO_MODE
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: reduce-my-url
  labels:
    app: api
spec:
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: api
